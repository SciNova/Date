[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-date"
version = "0.11"
description = "Gregorian date/time utilities (Date, Time, DateTime) for Gregorian calendar and Julian day calculations"
readme = { text = "Gregorian date/time utilities (Date, Time, DateTime) for Gregorian calendar and Julian day calculations.", content-type = "text/plain" }
license = "GPL-3.0-or-later"
requires-python = ">=3.8"

[tool.setuptools]
py-modules = ["Date"]
